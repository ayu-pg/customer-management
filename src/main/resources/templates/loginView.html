<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link rel="stylesheet" href="css/style.css">
	<link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
	<link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><!--アイコン-->
	<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet"><!--フォント文字-->
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta charset="UTF-8">
	<link rel="stylesheet" href="login.css">
	<link rel="stylesheet" href="loginHedder.css">
	<title>ログイン画面</title>
</head>
<script src="/login.js" defer></script>

<body>
	<header class="site-header">
		star system
	</header>

	<main>
		<div class="login-container">
			<h2>ログイン</h2>
			<form th:action="@{/login}" method="post">

				<div class="error-message">
					<div th:if="${errorMessage}" style="color:red;">
						<p th:text="${errorMessage}"></p>
					</div>

					<div class="password-wrapper">
						<label for="username">ユーザーID<i class="fa-solid fa-user"></i></label>
						<input type="text" id="username" name="userid" placeholder="user_id" required>
					</div>

					<div class="password-wrapper">
						<label for="password">パスワード<i class="fa-solid fa-lock"></i></label>
						<input type="password" id="password" name="password" placeholder="password" required>
						<button type="button" onclick="togglePasswordVisibility()" class="toggle-btn">
							<i id="toggleIcon" class="fa-solid fa-eye"></i>
						</button>
					</div>
					<br>
					<button class="button" type="submit">ログイン</button>
			</form>
		</div>
	</main>



	<footer class="site-footer">
		<div class="container">
			<p>&copy; 2025 Example Corp. All rights reserved.</p>
		</div>
	</footer>
</body>


<script>

</script>

</html>
